<app-container>
  <section class="relative min-h-[433px] my-20 bg-[#B7131A] rounded-[2rem] overflow-hidden flex flex-col md:grid md:grid-cols-2 items-stretch">
    
    <div class="z-10 flex flex-col items-center md:items-start text-center md:text-left justify-center px-8 sm:px-12 md:pl-16 md:pr-10 py-16 md:py-12">
      <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-white leading-[1.1] mb-6 tracking-tight">
        Organize a Blood<br class="hidden lg:block"> Donation Camp
      </h1>
      
      <p class="text-base sm:text-lg text-white/90 mb-10 max-w-md leading-relaxed">
        Help build a reliable blood supply. Partner with us to organize
        donation camps and connect donors with blood banks efficiently.
      </p>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLScLlHLer3CHhuVSc98lXus93SU5PKPWK2D_n1qU5XI4m5khVw/viewform" target="_blank" rel="noopener noreferrer" class="inline-block bg-white text-black px-10 py-4 rounded-xl font-bold text-base hover:bg-gray-100 transition-all transform active:scale-95 shadow-xl">
        Start journey
      </a>
    </div>

    <div class="relative w-full h-64 md:h-full overflow-hidden bg-[#B7131A]">
      <div 
        class="absolute inset-0 z-0 opacity-80"
        [style.backgroundImage]="'url(' + DNA + ')'"
        style="background-position: center; background-size: cover; background-repeat: no-repeat;">
      </div>

     
    </div>

  </section>
</app-container>
