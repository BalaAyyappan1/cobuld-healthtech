<app-container>
  <section class="min-h-screen  flex flex-col md:flex-row items-center md:justify-between gap-10 md:gap-4 pt-35 md:pt-35 lg:pt-0 xl:py-0 2xl:pt-0">

    <div class="flex flex-col items-start justify-center w-full md:w-1/2 md:max-w-xl">
      <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold leading-tight mb-4">
        Strengthening Blood Access.
        <span class="text-[#B7131A]">Saving Lives.</span>
      </h1>

      <p class="text-sm sm:text-base md:text-lg text-gray-600 mb-8">
        Timely access to blood can make the difference between life and loss.
        Coblud connects people, hospitals, and blood banks to ensure help reaches when it matters most.
      </p>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfnC3OE0RK3IPStBAnqqAlJZM9Celz9YLQlObi4ehsMyLABMw/viewform" target="_blank" rel="noopener noreferrer">
        <button class="bg-[#B7131A] text-white px-6 py-3 rounded-lg text-base font-semibold hover:bg-[#9a1016] transition-colors cursor-pointer">
          Request Blood
        </button>
      </a>
    </div>

    <div class="w-full md:w-1/2 flex justify-center items-center">
      <img
        [src]="heroImage"
        alt="Blood donation hero illustration"
        class="w-full sm:w-1/2 md:w-full md:max-w-lg lg:max-w-xl object-contain"
      />
    </div>

  </section>
</app-container>
