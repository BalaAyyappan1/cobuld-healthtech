<!-- Desktop Navbar -->
<nav class="absolute top-4 left-0 right-0 z-50 bg-transparent">
  <div class="px-6 md:px-20 h-16 flex items-center justify-between relative">

    <!-- Logo -->
    <a routerLink="/" class="no-underline">
      <img [src]="logo" alt="Cobuld" class="h-13 w-auto object-contain" />
    </a>

    <!-- Center Links -->
    <ul class="hidden lg:flex absolute left-1/2 -translate-x-1/2 gap-8 list-none m-0 p-0">
      <li>
        <a routerLink="/" routerLinkActive="!text-[#B7131A]" [routerLinkActiveOptions]="{ exact: true }"
          class="text-slate-700 text-sm font-medium no-underline hover:text-[#B7131A] transition-colors">Home</a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="!text-[#B7131A]"
          class="text-slate-700 text-sm font-medium no-underline hover:text-[#B7131A] transition-colors">About</a>
      </li>
      <li>
        <a routerLink="/how-it-works" routerLinkActive="!text-[#B7131A]"
          class="text-slate-700 text-sm font-medium no-underline hover:text-[#B7131A] transition-colors">How It Works</a>
      </li>

    </ul>

    <!-- Right CTA -->
    <div class="hidden lg:flex">
      <a routerLink="/contact" class="no-underline text-white text-sm font-semibold px-5 py-2 rounded-lg bg-[#B7131A] hover:bg-[#9a1016] transition-colors cursor-pointer">
        Contact us
      </a>
    </div>

    <!-- Hamburger -->
    <button
      class="lg:hidden flex flex-col gap-1.5 p-1 bg-transparent border-none cursor-pointer"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
    >
      <span class="block w-6 h-0.5 bg-slate-700 rounded"></span>
      <span class="block w-6 h-0.5 bg-slate-700 rounded"></span>
      <span class="block w-6 h-0.5 bg-slate-700 rounded"></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  @if (menuOpen()) {
    <div class="md:hidden flex flex-col gap-4 px-6 py-4 border-t border-gray-100 bg-white">
      <a routerLink="/" routerLinkActive="!text-[#B7131A] !font-semibold" [routerLinkActiveOptions]="{ exact: true }"
        (click)="toggleMenu()" class="text-slate-700 font-medium no-underline hover:text-[#B7131A] transition-colors">Home</a>
      <a routerLink="/about" routerLinkActive="!text-[#B7131A] !font-semibold"
        (click)="toggleMenu()" class="text-slate-700 font-medium no-underline hover:text-[#B7131A] transition-colors">About</a>
      <a routerLink="/how-it-works" routerLinkActive="!text-[#B7131A] !font-semibold"
        (click)="toggleMenu()" class="text-slate-700 font-medium no-underline hover:text-[#B7131A] transition-colors">How It Works</a>
      <a routerLink="/contact" routerLinkActive="!text-[#B7131A] !font-semibold"
        (click)="toggleMenu()" class="text-slate-700 font-medium no-underline hover:text-[#B7131A] transition-colors">Contact</a>
      <a routerLink="/contact" (click)="toggleMenu()"
        class="no-underline text-white text-sm font-semibold px-5 py-2 rounded-lg bg-[#B7131A] hover:bg-[#9a1016] transition-colors cursor-pointer text-center">
        Contact us
      </a>
    </div>
  }
</nav>
