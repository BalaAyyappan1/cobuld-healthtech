<app-container>
  <section class="min-h-screen  flex flex-col md:flex-row items-center md:justify-between gap-10 md:gap-4 pt-35 md:pt-35 lg:pt-0 xl:py-0 2xl:pt-0">

    <div class="flex flex-col items-start justify-center w-full md:w-1/2 md:max-w-2xl">
      <h1 class="text-[14px] text-[#B7131A]">OUR ORIGIN STORY</h1>
      <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold leading-tight tracking-tight mb-4">
        Ensuring
        <span class="text-[#B7131A]">Life Reaches
Those In Need.</span>
      </h1>

      <p class="text-sm sm:text-base md:text-lg text-gray-600 mb-5">
We exist to eliminate delays and uncertainty in accessing blood, ensuring every genuine request reaches the right source at the right time.
      </p>


      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLSfnC3OE0RK3IPStBAnqqAlJZM9Celz9YLQlObi4ehsMyLABMw/viewform"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-block bg-[#B7131A] text-white px-6 py-3 rounded-lg text-base font-semibold hover:bg-[#9a1016] transition-colors cursor-pointer">
        Join the Mission
      </a>
    </div>

    <div class="w-full md:w-1/2 flex justify-center items-center">
      <img
        [src]="aboutImage"
        alt="Blood donation hero illustration"
        class="w-full sm:w-1/2 md:w-full md:max-w-lg lg:max-w-xl object-contain"
      />
    </div>

  </section>
</app-container>
