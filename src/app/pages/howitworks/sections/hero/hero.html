<app-container>
  <section class="min-h-screen flex flex-col md:flex-row items-center md:justify-between gap-10 md:gap-4 pt-35 md:pt-35 lg:pt-0 xl:py-0 2xl:pt-0">

    <div class="flex flex-col items-start justify-center w-full md:w-1/2 md:max-w-xl">
      
      <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold leading-tighter tracking-tight mb-4">
Transforming the
journey.
      </h1>
      <p class="text-sm sm:text-base md:text-lg text-gray-600 mb-5">
       A streamlined process designed for speed and safety. Whether you are giving or organizing, we ensure every drop finds its purpose.
      </p>

    </div>

    <div class="w-full md:w-1/2 flex justify-center items-center">
      <img
        [src]="worksHeroImage"
        alt="How it works illustration"
        class="w-full sm:w-1/2 md:w-full md:max-w-lg lg:max-w-xl object-contain"
      />
    </div>

  </section>
</app-container>
