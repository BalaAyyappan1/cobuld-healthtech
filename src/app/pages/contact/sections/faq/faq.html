
  <section class="py-20 bg-[#F9F9F9]">
<app-container>
    <div fadeIn class=" mb-7">
      <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold text-gray-900 leading-tight">
        Frequently Asked Questions
      </h2>
    
    </div>

    <div class=" flex flex-col gap-4">

      @for (item of visibleFaqs; track item.question; let i = $index) {
        <div class="border border-gray-200 rounded-2xl overflow-hidden">
          <button
            class="w-full flex items-center justify-between px-6 py-5 text-left bg-[#F3F3F3]  transition-colors cursor-pointer"
            (click)="toggle(i)"
          >
            <span class="font-semibold text-gray-900 text-sm sm:text-base">{{ item.question }}</span>
            <span class="text-[#B7131A] text-xl font-bold ml-4">{{ openIndex === i ? '−' : '+' }}</span>
          </button>
          @if (openIndex === i) {
            <div class="px-6 pb-5 text-black text-sm leading-relaxed bg-[#F3F3F3] ">
              {{ item.answer }}
            </div>
          }
        </div>
      }

    </div>

    <div class="mt-6 text-center">
      <button
        class="px-6 py-2 border border-[#B7131A] text-[#B7131A] rounded-full text-sm font-semibold hover:bg-[#B7131A] hover:text-white transition-colors cursor-pointer"
        (click)="showAll = !showAll"
      >
        {{ showAll ? 'View Less' : 'View More' }}
      </button>
    </div>
</app-container>
  </section>
